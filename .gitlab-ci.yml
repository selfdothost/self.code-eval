# self.code-eval CI — yard-native image build.
# buildkit-rootless on bigbuild -> container.home (gitlab-profile#60 /
# self.infrastructure#143). NOT kaniko: kaniko's writable layer always lands on
# the node's containerd root and can't be redirected, OOM-ing tight-disk nodes;
# buildkit's state is a flag (`--root`) pointed at the /builds mount, and it runs
# rootless (uid 1000, SETUID/SETGID only) — strictly less privileged than kaniko.
# CPU-only: the harness runs code benchmarks by calling each model's
# OpenAI-compatible API. Builds the FastAPI control plane + the vendored
# code-eval framework into one image (api/main.py on :8094).
#
# Two-job split (selfinfra/zlib reference): build:code-eval is the MR gate —
# it builds with NO --output (buildkit's equivalent of kaniko --no-push), so it
# validates the image on every MR without pushing (the old single job pushed
# :latest straight from MRs). publish:code-eval builds + pushes on main only.

stages: [test, build, publish]

include:
  - project: 'selfshipyard/selfai/self.ai'
    ref: main
    file: '.gitlab/ci-templates/sync-public-alpha.yml'

default:
  tags: [bigbuild]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  BUILDKIT_IMAGE: "moby/buildkit:v0.31.2-rootless"   # pinned, not master
  # Bursty CI jobs: SMALL requests so a job schedules even on a busy node, HIGH
  # limits so it can burst when it actually runs. These jobs sit idle until
  # triggered, need real CPU/RAM only briefly, and don't all run at once — so
  # right-sizing the request (not the limit) is what lets k8s bin-pack them.
  # Requires the runner to permit resource overwrites (self.infrastructure#173).
  KUBERNETES_CPU_REQUEST: "250m"
  KUBERNETES_CPU_LIMIT: "8"
  KUBERNETES_MEMORY_REQUEST: "1Gi"
  KUBERNETES_MEMORY_LIMIT: "16Gi"

# Registry auth + buildkit state dir, both OUTSIDE the build context. Scratch is
# a SIBLING of $CI_PROJECT_DIR (never inside it): the context IS $CI_PROJECT_DIR,
# so state kept inside would feed the build its own state, and the CI_JOB_TOKEN
# credential must never sit where a `COPY . .` could bake it into the image
# (gitlab-profile#60 trap 3). --root points build bytes at the /builds mount,
# off the node's containerd root (the whole point of #143).
.buildkit-before: &buildkit-before
  - export BK_SCRATCH="${CI_BUILDS_DIR:-/builds}/.buildkit"
  - mkdir -p "$BK_SCRATCH" 2>/dev/null || export BK_SCRATCH="$(dirname "$CI_PROJECT_DIR")/.buildkit"
  - mkdir -p "$BK_SCRATCH/state" "$BK_SCRATCH/docker"
  - export DOCKER_CONFIG="$BK_SCRATCH/docker"
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_JOB_TOKEN" | base64 | tr -d '\n')\"}}}" > "$DOCKER_CONFIG/config.json"
  - chmod 600 "$DOCKER_CONFIG/config.json"
  - export BUILDKITD_FLAGS="--oci-worker-no-process-sandbox --root $BK_SCRATCH/state"

# --- publish: mirror main -> public-alpha (GitLab + GitHub), scheduled only -
sync:public-alpha:
  extends: .sync-public-alpha
  variables:
    MIRROR_EXCLUDE_PATHS: ""

# --- test: the Piston client + seam suite -----------------------------------
# Deliberately NOT the whole tests/ directory. The piston modules depend only on
# `requests` + stdlib, so this runs on the light `yard` runner in a slim image
# in seconds, with no torch/transformers/datasets install and no GPU node. The
# rest of tests/ needs the full harness runtime and belongs in a follow-up job
# that runs inside the built image — not wired yet, so don't read a green
# pipeline here as "all tests pass".
#
# Not allow_failure: these gate the execution path that decides whether
# model-generated code runs sandboxed or in-container. A red suite should stop
# the pipeline.
test:piston:
  stage: test
  tags: [yard]
  image: python:3.11-slim
  timeout: 15m
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - pip install --no-cache-dir pytest requests
  script:
    # `python -m pytest`, not `pytest` — the -m form puts the repo root on
    # sys.path, which is what makes `import code_eval` resolve (tests/ has no
    # __init__.py, so bare `pytest` would only add tests/ itself).
    - python -m pytest tests/test_piston_*.py -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - code_eval/piston/**/*
        - code_eval/tasks/custom_metrics/**/*
        - tests/test_piston_*.py
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
  # The gitlab-runner pod intermittently loses registry/DNS egress, which
  # surfaces here as a pip ENETUNREACH rather than a real test failure.
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, script_failure]

# self.ai#25: service-ticket auth layer on the control API (api/auth.py).
# Targeted job, not the full harness suite (test_prompts.py etc. need the
# heavy transformers/torch/datasets install this control-plane-only job
# deliberately skips) — same install footprint as self.llamolotl's own
# test:llamolotl job, plus PyJWT for the ticket module.
# Generation delivery accounting (#10). Its own job because it fits neither
# neighbour: test:piston globs tests/test_piston_*.py and test:code-eval-api
# runs tests/api only, so a tests/test_generation_health.py would have run
# NOWHERE — which is how tests/test_evaluator_details.py already sits unrun.
# Light deps on purpose: the module under test imports only requests + tqdm,
# and every HTTP call in the suite is stubbed.
test:generation-health:
  stage: test
  tags: [yard]
  image: python:3.11-slim
  timeout: 15m
  before_script:
    - pip install --no-cache-dir pytest requests tqdm
  script:
    - python -m pytest tests/test_generation_health.py -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

test:code-eval-api:
  stage: test
  # `yard`, not the inherited `bigbuild` (#9). This installs seven pip packages
  # into a slim image and runs a suite that takes 0.43s — it has no business on
  # the single heavy-build runner, which is `concurrent = 1` and shared across
  # the whole selfai group. Observed 2026-08-03: two publish pipelines sat
  # `pending` here for over two hours behind self.llamolotl's llama-server build
  # and then self.curator, while nidavellir idled at 2% CPU. Capacity was never
  # the constraint; the one slot was. Because stages run test -> build ->
  # publish, inheriting bigbuild made every pipeline take that slot TWICE, once
  # for this. test:piston below already gets this right.
  tags: [yard]
  image: python:3.11-slim
  timeout: 15m
  before_script:
    # `requests` is in requirements.txt and so is already in the runtime image
    # (the piston client imports it) — it is listed here only because this job
    # deliberately installs a trimmed set rather than requirements.txt, and
    # api/main.py's MultiPL-E dataset check uses it.
    - pip install --no-cache-dir fastapi "uvicorn[standard]" aiofiles httpx pytest PyJWT requests
  script:
    - pytest tests/api -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- build: MR gate — full image, NO push (omit --output = kaniko --no-push) ---
build:code-eval:
  stage: build
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  timeout: 1h
  before_script: *buildkit-before
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --import-cache "type=registry,ref=${IMAGE}/cache"
      --export-cache "type=registry,ref=${IMAGE}/cache,mode=max"

# --- publish: build + push :sha and :latest (main only) ---
publish:code-eval:
  stage: publish
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  timeout: 1h
  before_script: *buildkit-before
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    # --output value is CSV, so the tag list MUST be inner-quoted or the second
    # tag becomes a stray key → `error: invalid value ...` (gitlab-profile#60
    # trap 1). Assemble into a var so the nested quoting survives YAML→shell.
    - export TAGS="${IMAGE}:${CI_COMMIT_SHORT_SHA},${IMAGE}:latest"
    - 'export OUT="type=image,\"name=${TAGS}\",push=true"'
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR"
      --import-cache "type=registry,ref=${IMAGE}/cache"
      --export-cache "type=registry,ref=${IMAGE}/cache,mode=max"
      --output "$OUT"
